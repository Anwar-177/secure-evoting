spring.application.name=secure-evoting
server.port=${PORT:8085}

# ---------- Database (default: embedded H2 file database, no setup needed) ----------
# To use MySQL instead, run with:  --spring.profiles.active=mysql  (see application-mysql.properties)
spring.datasource.url=jdbc:h2:file:./data/evotingdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logins are handled by SecurityConfig; do not create Spring Boot's default generated user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB
server.tomcat.max-http-form-post-size=8MB

# ---------- Default admin account (created on first start) ----------
evoting.admin.username=admin
evoting.admin.password=admin123

# ---------- Security / blockchain settings ----------
# Secret used to derive the AES-256 vote encryption key and HMAC key. Change before real use.
evoting.security.secret=change-this-secret-key-for-your-election-2026
# Number of leading zeros required in a block hash (proof of work)
evoting.blockchain.difficulty=3
# Max Euclidean distance between face descriptors to accept a match (lower = stricter)
evoting.biometric.face-threshold=0.5
# Minutes a successful biometric verification stays valid for casting the vote
evoting.biometric.valid-minutes=10

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Error', ~{::main})}">
<body>
<main class="container container-narrow">
    <div class="card">
        <div class="card-body center" style="padding:48px 20px">
            <div class="stat-value" style="font-size:3rem;color:var(--primary)" th:text="${status}">404</div>
            <h1 th:switch="${status}">
                <span th:case="404">Page not found</span>
                <span th:case="403">Access denied</span>
                <span th:case="*">Something went wrong</span>
            </h1>
            <p class="muted" style="margin-top:8px" th:switch="${status}">
                <span th:case="404">The page you are looking for does not exist.</span>
                <span th:case="403">You do not have permission to open this page. Log in with the correct account.</span>
                <span th:case="*">Please try again.</span>
            </p>
            <a class="btn btn-primary" style="margin-top:12px" th:href="@{/}">Back to home</a>
        </div>
    </div>
</main>
</body>
</html>

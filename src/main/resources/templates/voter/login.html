<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{auth-layout :: page('Voter Login', ~{::main})}">
<body>
<main class="auth-main">
    <div class="auth-box">
        <div class="role-tabs" role="tablist" aria-label="Login type">
            <a class="active" role="tab" aria-selected="true" th:href="@{/voter/login}">Voter</a>
            <a role="tab" aria-selected="false" th:href="@{/admin/login}">Admin</a>
        </div>

        <h1>Welcome back</h1>
        <p class="auth-sub">Log in with your registered email to vote.</p>

        <div class="alert alert-error" role="alert" th:if="${param.error}">Incorrect email or password.</div>
        <div class="alert alert-error" role="alert" th:if="${param.locked}">
            Too many failed biometric attempts. You have been logged out for security.
        </div>

        <form th:action="@{/voter/login}" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                    <button type="button" class="input-addon" data-toggle-password="password" aria-label="Show password">Show</button>
                </div>
            </div>
            <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
        </form>

        <p class="auth-foot">New voter? <a th:href="@{/voter/register}">Create your voter account</a></p>
    </div>
    <script th:src="@{/js/auth.js}"></script>
</main>
</body>
</html>
